# =================================================================
# Qatra Mind IoT - Mosquitto Config (Acces Externe Telephone)
# =================================================================

# Ecoute sur TOUTES les interfaces : WiFi (192.168.0.111), LAN, etc.
listener 1883 0.0.0.0

# Autoriser les connexions sans mot de passe (test telephone)
allow_anonymous true

# Logs
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
